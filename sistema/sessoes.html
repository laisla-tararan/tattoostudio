<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tattoo Studio - Sessões</title>
</head>
<body> 
    <h1>Sessões</h1>

    <p><a href="/principal">Voltar</a></p>
    <table border="1">
        <tr>
            <th>Data</th>
            <th>Tatuador</th>
            <th>Projeto</th>
            <th>Cliente</th>
            <th>Alterar Data</th>
        </tr>
        {{#sessoes}}
        <tr>
            <td>{{data_br}}</td>
            <td>{{tatuador}}</td>
            <td>{{projeto}}</td>
            <td>{{cliente}}</td>
            <td>
                <form method="POST" action="/sessoes/{{id}}">
                    <input type="hidden" name="_method" value="PUT">
                    <input type="datetime-local" name="data_agendamento" value="{{data_input}}" required>
                    <button>Salvar</button>
                </form>
            </td>
            <td>
                <form method="POST" action="/sessoes/{{id}}">
                    <input type="hidden" name="_method" value="DELETE">
                    <button>Excluir</button>
                </form>
            </td>
        </tr>
        {{/sessoes}}
    </table>
    <h2>Cadastrar Sessão</h2>
    <form action="/sessoes" method="POST">
        <select name="projeto_id" required>
            <option value="">Selecione o projeto</option>
            {{#projetos}}
            <option value="{{id}}">{{titulo_tatuagem}}</option>
            {{/projetos}}
        </select>
        <input type="datetime-local" name="data_agendamento" required />
        <button type="submit">Cadastrar</button>
    </form>
    <p>{{erro}}</p>
</body>
</html>
